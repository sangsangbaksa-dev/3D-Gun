<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>좀비 타이쿤 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%236b8e4e%27/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--zt-bg,#0a0e14); font-family:var(--zt-font,system-ui,sans-serif); color:var(--zt-text,#e9eef5); user-select:none; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  .bar { position:absolute; left:18px; bottom:18px; width:272px; padding:10px 12px; background:var(--zt-glass,rgba(10,14,20,.72)); border:1px solid var(--zt-border,rgba(255,255,255,.12)); border-radius:var(--zt-radius,12px); backdrop-filter:var(--zt-blur,blur(10px)); box-shadow:var(--zt-shadow,0 8px 32px #0008); }
  .bar .track { height:14px; background:#0006; border:1px solid var(--zt-border); border-radius:999px; overflow:hidden; }
  .bar .fill { height:100%; background:linear-gradient(90deg,#ff5a4a,#c41e1e); width:100%; box-shadow:0 0 12px #ff3b3b66; transition:width .12s ease-out; }
  .bar .xp { height:5px; margin-top:6px; background:#0006; border-radius:999px; overflow:hidden; }
  .bar .xp div { height:100%; background:linear-gradient(90deg,#4cf,#2a9fd6); width:0; }
  #hpText { font-size:12px; font-weight:700; letter-spacing:.04em; margin-bottom:6px; color:var(--zt-muted); text-transform:uppercase; }
  #top { position:absolute; top:14px; left:50%; transform:translateX(-50%); text-align:center; padding:8px 20px; background:var(--zt-glass); border:1px solid var(--zt-border); border-radius:999px; backdrop-filter:var(--zt-blur); box-shadow:var(--zt-shadow); }
  #wave { font-size:18px; font-weight:800; letter-spacing:.06em; color:var(--zt-gold,#ffd23b); }
  #sub { font-size:13px; color:var(--zt-muted); margin-top:2px; }
  #boss { display:none; margin-top:8px; width:min(360px,80vw); }
  #boss .track { height:10px; background:#0006; border:1px solid var(--zt-border); border-radius:999px; overflow:hidden; }
  #boss .fill { height:100%; background:linear-gradient(90deg,#c86bff,#7a3dff); width:100%; }
  #res { position:absolute; top:14px; right:16px; text-align:right; font-size:13px; line-height:1.55; background:var(--zt-glass); border:1px solid var(--zt-border); padding:10px 14px; border-radius:var(--zt-radius); backdrop-filter:var(--zt-blur); box-shadow:var(--zt-shadow); font-variant-numeric:tabular-nums; }
  #ammo { display:none; }
  #help { position:absolute; left:16px; top:14px; max-width:min(380px,42vw); font-size:11.5px; line-height:1.55; color:var(--zt-muted); background:var(--zt-glass); border:1px solid var(--zt-border); padding:8px 12px; border-radius:var(--zt-radius-sm,8px); backdrop-filter:var(--zt-blur); opacity:.92; }
  #prompt { position:absolute; left:50%; top:62%; transform:translateX(-50%); font-size:15px; font-weight:600; background:var(--zt-glass); border:1px solid var(--zt-border-strong); padding:8px 16px; border-radius:999px; display:none; backdrop-filter:var(--zt-blur); box-shadow:var(--zt-shadow); }
  #prog { position:absolute; left:50%; top:67%; width:180px; height:6px; transform:translateX(-50%); background:#0006; border:1px solid var(--zt-border); border-radius:999px; overflow:hidden; display:none; }
  #prog div { height:100%; background:linear-gradient(90deg,var(--zt-gold),#ff9d3b); width:0; }
  #cross { display:none; }
  #toasts { position:absolute; left:18px; bottom:108px; font-size:13px; font-weight:600; }
  #toasts div { background:var(--zt-glass); border:1px solid var(--zt-border); padding:6px 12px; margin-top:6px; border-radius:var(--zt-radius-sm); width:fit-content; backdrop-filter:var(--zt-blur); animation:ztToastIn .25s ease-out; }
  @keyframes ztToastIn { from { opacity:0; transform:translateX(-8px); } }
  #banner { position:absolute; left:50%; top:22%; transform:translateX(-50%); font-size:clamp(28px,5vw,42px); font-weight:800; letter-spacing:.04em; text-shadow:0 4px 24px #000; opacity:0; transition:opacity .4s; white-space:nowrap; color:var(--zt-gold); }
  #pauseBanner { position:fixed; left:50%; top:38%; transform:translateX(-50%); display:none; padding:18px 36px; font-size:20px; font-weight:800; background:var(--zt-glass); border:1px solid var(--zt-border-strong); border-radius:var(--zt-radius); pointer-events:none; z-index:20; backdrop-filter:var(--zt-blur); box-shadow:var(--zt-shadow); }
  #lockHint { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:none; padding:8px 18px; font-size:12px; color:var(--zt-muted); background:var(--zt-glass); border:1px solid var(--zt-border); border-radius:999px; pointer-events:none; z-index:6; backdrop-filter:var(--zt-blur); }
  #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); z-index:5; }
  #box { background:var(--zt-surface-2,#1a2535); border:1px solid var(--zt-border-strong); border-radius:var(--zt-radius); padding:22px 26px; min-width:420px; max-width:720px; max-height:86vh; overflow:auto; box-shadow:var(--zt-shadow); }
  #box h2 { margin:0 0 12px; font-size:20px; }
  #box button { background:linear-gradient(var(--zt-accent,#3dba7a),var(--zt-accent-dim,#245a40)); color:#fff; border:0; border-radius:var(--zt-radius-sm); padding:8px 14px; margin:3px; cursor:pointer; font-size:14px; font-family:inherit; font-weight:600; }
  #box button:disabled { background:#2b3440; color:#8b96a5; cursor:default; }
  #box button.sec { background:#44505f; }
  #box .row { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--zt-border); padding:6px 0; gap:14px; }
  #box .br { margin-top:12px; color:var(--zt-info); font-weight:bold; }
  #box small { opacity:.7; color:var(--zt-muted); }
  .t0 { color:#ccc } .t1 { color:#6c6 } .t2 { color:#6af } .t3 { color:#fc3 }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="help">1인칭 · WASD 이동 · Shift 대시 · 클릭 사격 · R 재장전 · 1~6 무기<br>E 상호작용(채집/주사) · C 백신 · Q 아군 역할 · V 무기<br>B 건설(우클릭 철거) · Tab 스킬 · N 웨이브 바로 시작</div>
  <div id="top"><div id="wave"></div><div id="sub"></div><div id="boss"><div class="track"><div class="fill" id="bossFill"></div></div></div></div>
  <div id="res"></div>
  <div id="cross"></div>
  <div id="prompt"></div><div id="prog"><div></div></div>
  <div id="toasts"></div>
  <div id="banner"></div>
  <div class="bar"><div id="hpText"></div><div class="track"><div class="fill" id="hpFill"></div></div><div class="xp"><div id="xpFill"></div></div></div>
  <div id="ammo"></div>
</div>
<div id="pauseBanner">일시정지 — P 또는 Esc, 화면 클릭으로 계속</div>
<div id="lockHint">마우스가 화면 중앙에 고정되어 시점을 조작합니다 (화면 클릭) · 방향키/우클릭 드래그로도 가능 · P 일시정지</div>
<div id="modal"><div id="box"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
