<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D-GUN · 좀비 타이쿤 3D</title>
<script>
(function () {
  var ko = (navigator.language || '').toLowerCase().indexOf('ko') === 0;
  var m = new Date().getMonth() + 1;
  var extra = m === 11 ? (ko ? '11월, 기지 밖 안개' : 'November fog over the base')
    : m === 12 ? (ko ? '12월, 차가운 밤' : 'December cold nights') : '';
  var base = ko
    ? '좀비 타이쿤 3D — 웨이브 방어, 기지 건설, 본부 영구 성장.'
  : 'Zombie Tycoon 3D — wave defense, base building, permanent HQ upgrades.';
  var meta = document.createElement('meta');
  meta.name = 'description';
  meta.content = extra ? base + ' ' + extra : base;
  document.head.appendChild(meta);
  if (m === 11) { document.documentElement.dataset.season = 'november'; document.body.dataset.season = 'november'; }
  else if (m === 12) { document.documentElement.dataset.season = 'december'; document.body.dataset.season = 'december'; }
  var titleBase = ko ? '3D-GUN · 좀비 타이쿤 3D' : '3D-GUN · Zombie Tycoon 3D';
  var titleExtra = m === 11 ? (ko ? ' · 11월, 기지 밖 안개' : ' · November fog over the base')
    : m === 12 ? (ko ? ' · 12월, 차가운 밤' : ' · December cold nights') : '';
  document.title = titleBase + titleExtra;
})();
</script>
<meta property="og:type" content="website" />
<meta property="og:site_name" content="3D-GUN" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  /* HUD 팔레트: 배경 #10141a · 청록 #2EE6D6 · 주황 #FF8A2A · 빨강 #E0303A · 패널 #121A20 (빨간 배포판에서 옮겨 옴) */
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--zt-bg,#10141a); font-family:var(--zt-font,'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif); color:var(--zt-text,#eee); user-select:none; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #logo { position:absolute; left:16px; top:12px; height:30px; opacity:.9; }
  .bar { position:absolute; left:16px; bottom:16px; width:260px; }
  .bar .track { position:relative; height:16px; background:#0008; border:1px solid #fff4; border-radius:4px; overflow:hidden; }
  .bar .ghost { position:absolute; left:0; top:0; bottom:0; width:100%; background:#fff; opacity:.85; transition:width .3s ease-out .4s; }
  .bar .ghost.up { transition:none; }
  .bar .fill { position:relative; height:100%; background:#E0303A; width:100%; transition:width .25s ease-out; }
  .bar.low .fill { animation:hpLow 1.2s ease-in-out infinite; }
  body[data-season="november"] .bar.low .fill { background:linear-gradient(90deg,#4a6898,#8ec4e8); animation:hpLowNov 1.2s ease-in-out infinite; }
  body[data-season="december"] .bar.low .fill { background:linear-gradient(90deg,#5a4898,#b8a8e0); animation:hpLowDec 1.2s ease-in-out infinite; }
  @keyframes hpLow { 50% { opacity:.45; } }
  @keyframes hpLowNov { 50% { opacity:.48; } }
  @keyframes hpLowDec { 50% { opacity:.48; } }
  .bar .xp { height:6px; margin-top:4px; background:#0008; border-radius:3px; overflow:hidden; }
  .bar .xp div { height:100%; background:#2EE6D6; width:0; transition:width .3s ease-out; }
  #hpText { font-size:13px; margin-bottom:3px; text-shadow:0 1px 2px #000; font-variant-numeric:tabular-nums; }
  #top { position:absolute; top:12px; left:50%; transform:translateX(-50%); text-align:center; text-shadow:0 2px 4px #000; }
  #wave { font-size:22px; font-weight:bold; letter-spacing:.5px; }
  #wave.pop { animation:wavePop .4s ease-out; }
  @keyframes wavePop { from { color:#FF8A2A; transform:scale(1.12); } to { color:#fff; transform:scale(1); } }
  body[data-season="november"] #wave.pop { animation:wavePopNov .4s ease-out; }
  body[data-season="december"] #wave.pop { animation:wavePopDec .4s ease-out; }
  @keyframes wavePopNov { from { color:#8ec4e8; transform:scale(1.12); } to { color:#fff; transform:scale(1); } }
  @keyframes wavePopDec { from { color:#b8a8e0; transform:scale(1.12); } to { color:#fff; transform:scale(1); } }
  @media (prefers-reduced-motion:reduce) { #wave.pop { animation:none; } .bar .fill, .bar .xp div, .bar .ghost { transition:none; } .bar.low .fill { animation:none; } }
  #sub { font-size:14px; opacity:.9; white-space:nowrap; transition:color .25s; }
  #sub.urgent { color:#FF8A2A; font-weight:700; animation:subPulse 1s ease-in-out infinite; }
  body[data-season="november"] #sub.urgent { color:#8ec4e8; }
  body[data-season="december"] #sub.urgent { color:#b8a8e0; }
  @keyframes subPulse { 50% { opacity:.65; } }
  #prepBar { display:none; margin:7px auto 0; width:min(300px,88vw); height:5px; background:#0009; border-radius:3px; overflow:hidden; border:1px solid #2EE6D633; }
  #prepBar .fill { height:100%; width:100%; background:linear-gradient(90deg,#1a8a82,#2EE6D6); transition:width .12s linear; }
  #prepBar.urgent .fill { background:linear-gradient(90deg,#c45a10,#FF8A2A); }
  #prepBar.paused .fill { background:#5a6a70; opacity:.85; }
  body[data-season="november"] #prepBar { border-color:#5a8cb044; }
  body[data-season="november"] #prepBar .fill { background:linear-gradient(90deg,#1a5a72,#6a9cc4); }
  body[data-season="november"] #prepBar.urgent .fill { background:linear-gradient(90deg,#8a5018,#d4a060); }
  body[data-season="december"] #prepBar { border-color:#6a5a9a44; }
  body[data-season="december"] #prepBar .fill { background:linear-gradient(90deg,#2a4a68,#7a8ac8); }
  body[data-season="december"] #prepBar.urgent .fill { background:linear-gradient(90deg,#6a3818,#e8a070); }
  body[data-season="november"] #coreBar.low .fill { background:linear-gradient(90deg,#4a6898,#7aa8d8); animation:coreBarLowNov 1.2s ease-in-out infinite; }
  body[data-season="december"] #coreBar.low .fill { background:linear-gradient(90deg,#5a4898,#9a88d8); animation:coreBarLowDec 1.2s ease-in-out infinite; }
  @keyframes coreBarLowNov { 50% { opacity:.48; } }
  @keyframes coreBarLowDec { 50% { opacity:.48; } }
  #boss { display:none; margin:8px auto 0; width:min(420px,92vw); text-align:left; }
  #bossName { font-size:12px; font-weight:800; letter-spacing:.12em; color:#FF8A2A; margin-bottom:4px; text-shadow:0 1px 4px #000; }
  body[data-season="november"] #bossName { color:#8ec4e8; text-shadow:0 1px 6px #1a3048; }
  body[data-season="december"] #bossName { color:#b8a8e0; text-shadow:0 1px 6px #2a2048; }
  #boss .track { position:relative; height:14px; background:#000a; border:1px solid #E0303A88; border-radius:4px; overflow:hidden; box-shadow:0 0 12px #E0303A33 inset; }
  body[data-season="november"] #boss .track { border-color:#5a8cb088; box-shadow:0 0 14px #3a5a7844 inset; }
  body[data-season="december"] #boss .track { border-color:#7a6ab088; box-shadow:0 0 14px #4a3a6844 inset; }
  body[data-season="november"] #boss .fill { background:linear-gradient(90deg,#3a5878,#6a9cc4); }
  body[data-season="december"] #boss .fill { background:linear-gradient(90deg,#4a3878,#8a7ac8); }
  #boss .fill { height:100%; background:linear-gradient(90deg,#a01820,#E0303A); width:100%; transition:width .15s ease-out; }
  #boss.rage .fill { background:linear-gradient(90deg,#ff6020,#ff1a1a); animation:bossRage .45s ease-in-out infinite; }
  @keyframes bossRage { 50% { filter:brightness(1.25); } }
  #coreBar { margin:6px auto 0; width:min(280px,88vw); }
  #coreBar .lbl { font-size:11px;font-weight:700;letter-spacing:.08em;color:#2EE6D6;margin-bottom:3px;text-shadow:0 1px 3px #000;display:flex;justify-content:space-between;gap:8px }
  body[data-season="november"] #coreBar .lbl { color:#6a9cc4; }
  body[data-season="december"] #coreBar .lbl { color:#8a7ac8; }
  #coreBar .lbl span { font-variant-numeric:tabular-nums;color:#d6e4e8;font-weight:600 }
  #coreBar .track { position:relative;height:10px;background:#000a;border:1px solid #2EE6D644;border-radius:4px;overflow:hidden }
  #coreBar .fill { height:100%;width:100%;background:linear-gradient(90deg,#1a8a82,#2EE6D6);transition:width .2s ease-out }
  #coreBar.low .fill { background:linear-gradient(90deg,#a01820,#E0303A); animation:coreBarLow 1.1s ease-in-out infinite }
  @keyframes coreBarLow { 50% { opacity:.5; } }
  #banner { pointer-events:none; }
  #banner.show { animation:waveBanner 2.1s ease-out forwards; }
  @keyframes waveBanner { 0% { opacity:0; transform:translate(-50%,-12px) scale(.92); } 12% { opacity:1; transform:translate(-50%,0) scale(1); } 78% { opacity:1; } 100% { opacity:0; transform:translate(-50%,6px) scale(.98); } }
  body.ztCoreLow #hud::after { content:""; position:fixed; inset:0; pointer-events:none; box-shadow:inset 0 0 120px 24px #E0303A66; animation:coreWarn 1.4s ease-in-out infinite; z-index:3; }
  body.ztCoreLow[data-season="november"] #hud::after { box-shadow:inset 0 0 130px 28px rgba(88,148,210,.48); }
  body.ztCoreLow[data-season="december"] #hud::after { box-shadow:inset 0 0 130px 28px rgba(118,98,168,.45); }
  @keyframes coreWarn { 50% { opacity:.55; } }
  #res { position:absolute; top:12px; right:14px; text-align:right; font-size:14px; line-height:1.6; text-shadow:0 1px 3px #000; background:#121A20B3; border:1px solid #2EE6D6; padding:8px 12px; border-radius:8px; font-variant-numeric:tabular-nums; max-width:min(560px,40vw); }
  body[data-season="november"] #res { border-color:#5a8cb0; box-shadow:0 0 20px #3a5a7824; }
  body[data-season="december"] #res { border-color:#7a6ab0; box-shadow:0 0 20px #4a3a6824; }
  body[data-season="november"] #pauseBanner { border-color:#5a8cb0; box-shadow:0 8px 32px #000a,0 0 24px #3a5a7833; }
  body[data-season="december"] #pauseBanner { border-color:#7a6ab0; box-shadow:0 8px 32px #000a,0 0 24px #4a3a6833; }
  #ammo { position:absolute; right:20px; bottom:16px; text-align:right; text-shadow:0 2px 4px #000; }
  #ammo b { font-size:30px; }
  #help { position:absolute; left:16px; top:50px; font-size:12px; line-height:1.6; opacity:.75; text-shadow:0 1px 2px #000; }
  #prompt { position:absolute; left:50%; top:62%; transform:translateX(-50%); font-size:16px; text-shadow:0 2px 4px #000; background:#0007; padding:4px 12px; border-radius:6px; display:none; }
  #prog { position:absolute; left:50%; top:67%; width:160px; height:8px; transform:translateX(-50%); background:#0008; border-radius:4px; overflow:hidden; display:none; }
  #prog div { height:100%; background:#FF8A2A; width:0; }
  /* 정적 조준선: 플레이테스트 모드용. 전투 HUD(pv-cross)가 있으면 숨겨진다 */
  #cross { position:absolute; left:50%; top:50%; width:18px; height:18px; transform:translate(-50%,-50%); }
  #cross::before, #cross::after { content:''; position:absolute; background:#fff; opacity:.85; }
  #cross::before { left:8px; top:0; width:2px; height:18px; -webkit-mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%); mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%); }
  #cross::after { top:8px; left:0; height:2px; width:18px; -webkit-mask:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%); mask:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%); }
  #cross.hit::before, #cross.hit::after { background:#E0303A; opacity:1; }
  #toasts { position:fixed; left:16px; bottom:90px; font-size:14px; text-shadow:0 1px 3px #000; z-index:40; pointer-events:none; }
  #toasts div { background:#000a; padding:3px 10px; margin-top:4px; border-radius:4px; width:fit-content; animation:ztToastIn .28s ease-out; transition:opacity .35s ease-out,transform .35s ease-out; }
  #toasts div.toast-cheat { background:#1a2830e6; border:1px solid #2EE6D6; padding:8px 14px; font-weight:700; font-size:15px; box-shadow:0 0 16px #2EE6D633; }
  @keyframes ztToastIn { from { opacity:0; transform:translateX(-8px); } }
  #banner { position:absolute; left:50%; top:22%; transform:translateX(-50%); font-size:42px; font-weight:bold; text-shadow:0 3px 8px #000; opacity:0; transition:opacity .4s; white-space:nowrap; }
  body[data-season="november"] #banner { text-shadow:0 3px 12px #0a1828,0 0 28px #3a5a7855; }
  body[data-season="december"] #banner { text-shadow:0 3px 12px #1a1428,0 0 28px #4a3a6855; }
  #pauseBanner { position:fixed; left:50%; top:40%; transform:translateX(-50%) scale(.96); display:block; padding:16px 34px; font-size:22px; font-weight:800; background:#121A20E6; border:1px solid #2EE6D6; border-radius:10px; pointer-events:none; z-index:20; opacity:0; visibility:hidden; transition:opacity .22s ease-out,transform .22s ease-out,visibility .22s; }
  #pauseBanner.on { opacity:1; visibility:visible; transform:translateX(-50%) scale(1); }
  #lockHint { position:fixed; left:50%; top:68px; transform:translateX(-50%); display:none; max-width:calc(100vw - 32px); box-sizing:border-box; padding:5px 14px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#0009; border-radius:20px; opacity:0; pointer-events:none; z-index:6; transition:opacity .2s ease-out; }
  #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000b; z-index:5; }
  #box { background:#121A20F2; border:1px solid #2EE6D6; border-radius:10px; padding:20px 26px; min-width:420px; max-width:720px; max-height:86vh; overflow:auto; box-shadow:0 10px 40px #000; }
  body[data-season="november"] #box { border-color:#5a8cb0; box-shadow:0 10px 40px #000,0 0 24px #3a5a7828; }
  body[data-season="december"] #box { border-color:#7a6ab0; box-shadow:0 10px 40px #000,0 0 24px #4a3a6828; }
  #box h2 { margin:0 0 12px; }
  #box button { background:#2f6f4e; color:#fff; border:0; border-radius:5px; padding:6px 12px; margin:3px; cursor:pointer; font-size:14px; font-family:inherit; }
  #box button:disabled { background:#444; color:#999; cursor:default; }
  #box button.sec { background:#44505f; }
  #box .row { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #fff1; padding:5px 0; gap:14px; }
  #box .br { margin-top:12px; color:#9cf; font-weight:bold; }
  #box small { opacity:.7; }
  .t0 { color:#ccc } .t1 { color:#6c6 } .t2 { color:#6af } .t3 { color:#fc3 }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <img id="logo" src="/logo.svg" alt="3D-GUN" />
  <div id="help">WASD 이동 · Shift 대시 · 클릭 사격 · R 재장전<br>B 건설 · 1 감시탑 · 5 연구소 · L 백신 · N 웨이브 · H 도움말</div>
  <div id="top"><div id="wave"></div><div id="sub"></div><div id="prepBar"><div class="fill" id="prepFill"></div></div><div id="coreBar"><div class="lbl">핵 <span id="coreText"></span></div><div class="track"><div class="fill" id="coreFill"></div></div></div><div id="boss"><div id="bossName"></div><div class="track"><div class="fill" id="bossFill"></div></div></div></div>
  <div id="res"></div>
  <div id="cross"></div>
  <div id="prompt"></div><div id="prog"><div></div></div>
  <div id="banner"></div>
  <div class="bar"><div id="hpText"></div><div class="track"><div class="ghost" id="hpGhost"></div><div class="fill" id="hpFill"></div></div><div class="xp"><div id="xpFill"></div></div></div>
  <div id="ammo"></div>
</div>
<div id="toasts"></div>
<div id="pauseBanner">일시정지 — P 또는 Esc, 화면 클릭으로 계속 · H 도움말</div>
<div id="lockHint">클릭 시점 고정 · 우클릭 조준 · WASD 이동 · P 일시정지 · H 도움말</div>
<div id="modal"><div id="box"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
